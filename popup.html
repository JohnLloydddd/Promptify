<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Promptify</title>
    <style>
      :root {
        --bg: #ffffff;
        --surface: #f6f6f7;
        --surface-hover: #eeeeef;
        --border: #e4e4e7;
        --text: #18181b;
        --text-muted: #71717a;
        --accent: #0d9488;
        --accent-hover: #0f766e;
        --accent-contrast: #ffffff;
        --danger: #dc2626;
        --danger-surface: #fef2f2;
        --radius-sm: 6px;
        --radius: 10px;
        --shadow-sm: 0 1px 2px rgba(24, 24, 27, 0.06);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1c1f;
          --surface: #26262a;
          --surface-hover: #303035;
          --border: #38383e;
          --text: #f4f4f5;
          --text-muted: #a1a1aa;
          --accent: #14b8a6;
          --accent-hover: #2dd4bf;
          --accent-contrast: #0b1211;
          --danger: #f87171;
          --danger-surface: #3a1d1d;
          --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        width: 320px;
        max-height: 560px;
        overflow-y: auto;
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        font-size: 13px;
      }

      .view {
        display: flex;
        flex-direction: column;
      }

      .hidden {
        display: none !important;
      }

      /* header */
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px 10px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 7px;
      }

      .brand-icon {
        display: block;
        flex-shrink: 0;
        border-radius: 5px;
      }

      .wordmark {
        position: relative;
        display: inline-flex;
        align-items: baseline;
        font-weight: 800;
        font-size: 17px;
        letter-spacing: -0.02em;
        line-height: 1;
      }

      .wm-dark {
        color: #1e1b3a;
      }

      @media (prefers-color-scheme: dark) {
        .wm-dark {
          color: #f4f4f5;
        }
      }

      .wm-gradient {
        background: linear-gradient(100deg, #6d5bd0 10%, #8b7ff0 55%, #4fb8c4 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .wm-i {
        position: relative;
        display: inline-block;
      }

      .wm-dot {
        position: absolute;
        top: 1px;
        left: 50%;
        transform: translateX(-50%);
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--accent);
      }

      .wm-spark {
        position: absolute;
        top: -7px;
        right: -11px;
        width: 10px;
        height: 10px;
        color: #8b7ff0;
      }

      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        border-radius: var(--radius-sm);
        border: none;
        background: transparent;
        color: var(--text-muted);
        cursor: pointer;
        padding: 0;
      }

      .icon-btn:hover {
        background: var(--surface-hover);
        color: var(--text);
      }

      .icon-btn svg {
        width: 16px;
        height: 16px;
      }

      /* segmented control */
      .segmented {
        display: flex;
        margin: 0 16px 12px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 2px;
        gap: 2px;
      }

      .segmented button {
        flex: 1;
        border: none;
        background: transparent;
        color: var(--text-muted);
        font: inherit;
        font-weight: 500;
        font-size: 12px;
        padding: 6px 0;
        border-radius: 5px;
        cursor: pointer;
      }

      .segmented button.active {
        background: var(--bg);
        color: var(--text);
        box-shadow: var(--shadow-sm);
      }

      /* search */
      #searchWrap {
        padding: 0 16px 10px;
      }

      #searchInput {
        width: 100%;
        box-sizing: border-box;
        font: inherit;
        font-size: 12.5px;
        padding: 7px 9px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface);
        color: var(--text);
      }

      /* prompt list */
      #promptList {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 0 16px;
      }

      .prompt-row {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        text-align: left;
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: var(--radius);
        padding: 9px 10px;
        cursor: grab;
        font: inherit;
        color: var(--text);
      }

      .prompt-row:hover {
        background: var(--surface-hover);
        border-color: var(--accent);
      }

      .prompt-row:active {
        transform: scale(0.99);
      }

      .prompt-row.drag-over {
        border-color: var(--accent);
      }

      .prompt-text {
        min-width: 0;
        flex: 1;
      }

      .prompt-name {
        font-weight: 600;
        font-size: 12.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .prompt-preview {
        margin-top: 1px;
        font-size: 11px;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .prompt-row .go-arrow {
        flex-shrink: 0;
        color: var(--text-muted);
      }

      .prompt-row .go-arrow svg {
        width: 13px;
        height: 13px;
        display: block;
      }

      /* footer / add */
      .add-row {
        padding: 12px 16px 16px;
      }

      .btn {
        font: inherit;
        font-weight: 600;
        font-size: 12.5px;
        padding: 9px 12px;
        border-radius: var(--radius-sm);
        border: 1px solid transparent;
        cursor: pointer;
      }

      .btn-primary {
        background: var(--accent);
        color: var(--accent-contrast);
        width: 100%;
      }

      .btn-primary:hover {
        background: var(--accent-hover);
      }

      .btn-ghost {
        background: transparent;
        border: 1px dashed var(--border);
        color: var(--text-muted);
        width: 100%;
      }

      .btn-ghost:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      /* empty state */
      #emptyState {
        text-align: center;
        padding: 28px 16px;
        color: var(--text-muted);
      }

      #emptyState p {
        margin: 0 0 12px;
        font-size: 12.5px;
      }

      /* edit view */
      .edit-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 14px 16px 10px;
      }

      .edit-header h1 {
        font-size: 13px;
        font-weight: 600;
        margin: 0;
      }

      #editList {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 0 16px;
      }

      .edit-card {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 10px;
        background: var(--surface);
        cursor: grab;
      }

      .edit-card.drag-over {
        border-color: var(--accent);
      }

      .edit-card-top {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 6px;
      }

      .edit-card-top input[type="text"] {
        flex: 1;
        min-width: 0;
        font: inherit;
        font-weight: 600;
        font-size: 12.5px;
        padding: 6px 8px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--bg);
        color: var(--text);
      }

      .edit-card textarea {
        width: 100%;
        min-height: 64px;
        resize: vertical;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 11.5px;
        line-height: 1.5;
        padding: 7px 8px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--bg);
        color: var(--text);
        white-space: pre;
        overflow-x: auto;
      }

      input:focus,
      textarea:focus,
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      .delete-btn {
        color: var(--text-muted);
      }

      .delete-btn:hover {
        background: var(--danger-surface);
        color: var(--danger);
      }

      .edit-footer {
        padding: 12px 16px 16px;
      }

      /* toast */
      #toast {
        position: fixed;
        left: 16px;
        right: 16px;
        bottom: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-size: 12px;
        font-weight: 500;
        padding: 8px 10px;
        border-radius: var(--radius-sm);
        background: var(--text);
        color: var(--bg);
        opacity: 0;
        transform: translateY(4px);
        transition:
          opacity 0.15s ease,
          transform 0.15s ease;
        pointer-events: none;
      }

      #toast.show {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }

      .toast-action {
        flex-shrink: 0;
        background: transparent;
        border: none;
        color: inherit;
        font: inherit;
        font-weight: 700;
        text-decoration: underline;
        padding: 0;
        cursor: pointer;
      }

      #toast.error {
        background: var(--danger);
        color: white;
      }
    </style>
  </head>
  <body>
    <div id="mainView" class="view">
      <header>
        <div class="brand">
          <img class="brand-icon" src="icons/header-icon.png" alt="" width="22" height="22" />
          <div class="wordmark">
            <span class="wm-dark">Prompt</span><span class="wm-gradient"><span class="wm-i">&#305;<span class="wm-dot"></span></span>fy</span>
            <svg class="wm-spark" viewBox="0 0 20 20" fill="currentColor"><path d="M10 1.5 11.3 8.7 18.5 10 11.3 11.3 10 18.5 8.7 11.3 1.5 10 8.7 8.7Z"/></svg>
          </div>
        </div>
        <button id="manageBtn" class="icon-btn" title="Manage prompts" aria-label="Manage prompts"></button>
      </header>

      <div id="targetToggle" class="segmented"></div>

      <div id="searchWrap" class="hidden">
        <input id="searchInput" type="text" placeholder="Search prompts" />
      </div>

      <div id="promptList"></div>

      <div id="emptyState" class="hidden">
        <p>No prompts yet.</p>
        <button id="emptyAddBtn" class="btn btn-primary" style="width: auto; padding: 8px 14px;">
          Add your first prompt
        </button>
      </div>

      <div class="add-row">
        <button id="addBtn" class="btn btn-ghost">+ Add prompt</button>
      </div>
    </div>

    <div id="editView" class="view hidden">
      <div class="edit-header">
        <button id="backBtn" class="icon-btn" title="Back" aria-label="Back"></button>
        <h1>Manage prompts</h1>
      </div>

      <div id="editList"></div>

      <div class="edit-footer" style="display: flex; flex-direction: column; gap: 8px;">
        <button id="addPromptBtn" class="btn btn-ghost">+ Add prompt</button>
        <button id="doneBtn" class="btn btn-primary">Done</button>
      </div>
    </div>

    <div id="toast"></div>

    <script src="paste-logic.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
